name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  syntax:
    name: Python ${{ matrix.python }}
    runs-on: windows-latest
    strategy:
      matrix:
        python: ["3.9", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Syntax check
        run: python -m compileall -q gm-tool auth-server

      - name: Check locale catalogs
        run: python scripts/check_locales.py

      - name: Install auth-service dependencies
        run: pip install -r auth-server/requirements.txt

      - name: Core logic self-test
        run: python scripts/selftest.py
